[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biorefinery-scheduling"
version = "0.0.1"
description = "Modularized biorefinery scheduling and MPC toolkit (refactored subset)"
readme = "README.md"
authors = [ { name = "Refactor Contributor" } ]
license = { text = "Proprietary / Academic" }
requires-python = ">=3.9"
keywords = ["pyomo", "optimization", "scheduling", "biorefinery", "MPC", "GDP"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "pyomo",
  "pandas",
  "numpy",
  "scipy",
  "matplotlib"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "jsonschema", "psutil"]

[tool.setuptools]
package-dir = {"" = "biorefinery/src"}

[tool.setuptools.packages.find]
where = ["biorefinery/src"]
include = ["biorefinery*" ]

[tool.pytest.ini_options]
pythonpath = ["biorefinery/src"]
addopts = "-q"
